name: Skills
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - name: Check skill metadata and references
        run: python scripts/validate_skills.py
      - name: Check installer discovery
        run: npx --yes skills@1.7.1 add . --list
        env:
          DISABLE_TELEMETRY: '1'
      - name: Check examples through published packages
        run: python tests/check_examples.py
